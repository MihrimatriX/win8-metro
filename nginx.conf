server {
  listen 3200;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # Next'in dosya adları içerik hash'i taşır: değişirse adı da değişir, sonsuza kadar önbelleğe alınabilir.
  location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  # Static export writes the OG image without an extension; crawlers reject it unless it's served as PNG.
  location = /opengraph-image { default_type image/png; add_header Cache-Control "public, max-age=86400"; }
  location /fonts/ { add_header Cache-Control "public, max-age=2592000"; }
  # HTML always revalidates (cheap 304), so a new deploy shows up immediately.
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri.html $uri/ =404; }
}
